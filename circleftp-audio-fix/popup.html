<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CircleFTP Audio Fix</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      min-height: 160px;
      background: linear-gradient(160deg, #0d1117 0%, #161b22 100%);
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      background: rgba(255,255,255,0.03);
    }

    .header-icon {
      font-size: 22px;
    }

    .header-text h1 {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.3px;
    }

    .header-text p {
      font-size: 11px;
      color: #6e7681;
      margin-top: 1px;
    }

    .status-section {
      padding: 12px 16px;
    }

    .status-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      flex-shrink: 0;
    }

    .status-dot.checking {
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
      animation: pulse 1.2s ease-in-out infinite;
    }

    .status-dot.inactive {
      background: #6e7681;
      box-shadow: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-text {
      font-size: 12px;
      color: #8b949e;
      line-height: 1.4;
    }

    .status-text strong {
      display: block;
      color: #e6edf3;
      font-size: 13px;
    }

    .info-section {
      padding: 0 16px 12px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 12px;
    }
    .info-row:last-child { border-bottom: none; }

    .info-label { color: #6e7681; }
    .info-value { color: #c9d1d9; font-weight: 500; }
    .info-value.ok { color: #10b981; }
    .info-value.warn { color: #f59e0b; }

    .btn-section {
      padding: 0 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: inherit;
      letter-spacing: 0.2px;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #000;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.25);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
      transform: translateY(-1px);
    }
    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: #c9d1d9;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
      transform: translateY(-1px);
    }
    .btn-secondary:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    .btn-km {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #fff;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.25);
    }
    .btn-km:hover {
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
      transform: translateY(-1px);
    }

    .footer {
      padding: 10px 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #3d444d;
    }

    .footer a {
      color: #3d444d;
      text-decoration: none;
    }
    .footer a:hover { color: #6e7681; }

    .no-video {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 24px 16px;
      text-align: center;
      color: #6e7681;
    }

    .no-video .icon { font-size: 36px; }
    .no-video p { font-size: 12px; line-height: 1.5; }
    .no-video strong { color: #8b949e; }
  </style>
</head>
<body>

  <div class="header">
    <span class="header-icon">🎬</span>
    <div class="header-text">
      <h1>CircleFTP Audio Fix</h1>
      <p>MKV / AC-3 / DTS codec helper</p>
    </div>
  </div>

  <div id="main-content">
    <!-- Populated by popup.js -->
  </div>

  <div class="footer">
    <span>⚡</span>
    <span>Active on circleftp.net pages</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
